    .ants { animation: march 3.2s linear infinite; }
    @keyframes softPulse { 0%,100% { opacity: .35; } 50% { opacity: .95; } }
    .nodeDot { animation: softPulse 2.6s ease-in-out infinite; }
    @keyframes riseFade { 0% { opacity: 0; transform: translateY(6px);} 100% { opacity: 1; transform: translateY(0);} }
    text { font-kerning: normal; }
  ]]></style>
